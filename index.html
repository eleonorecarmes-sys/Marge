<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --soft:#f4f5f9; --ink:#1b1e2b; --muted:#5b6174; --line:#e2e4ee;
  --accent:#1b3a6b; --accent-ink:#ffffff; --accent-soft:color-mix(in srgb,var(--accent) 9%,#ffffff);
  --danger:#d92d4a; --danger-soft:#fde8ec; --shadow:0 1px 6px rgba(27,30,43,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13141b; --surface:#1d1f2a; --soft:#252837; --ink:#eceef6; --muted:#9ca2b6; --line:#2d3040;
    --accent-soft:color-mix(in srgb,var(--accent) 24%,#1d1f2a); --danger:#ff6b84; --danger-soft:#3b2029; --shadow:0 1px 6px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#13141b; --surface:#1d1f2a; --soft:#252837; --ink:#eceef6; --muted:#9ca2b6; --line:#2d3040;
  --accent-soft:color-mix(in srgb,var(--accent) 24%,#1d1f2a); --danger:#ff6b84; --danger-soft:#3b2029; --shadow:0 1px 6px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
body{min-height:100vh;min-height:100dvh}
#app{max-width:560px;margin:0 auto;padding:0 16px calc(100px + env(safe-area-inset-bottom));padding-top:calc(14px + env(safe-area-inset-top))}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0}
h1{font-size:30px;letter-spacing:-.025em;font-weight:700;line-height:1.08;margin:6px 0 2px}
h2{font-size:17px;font-weight:700;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);margin:2px 0 14px;font-size:15px}
.n{font:600 12px Figtree,sans-serif;background:var(--line);color:var(--muted);border-radius:99px;padding:1px 8px}
.late{color:var(--danger)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;min-height:46px}
textarea{resize:none;min-height:96px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0}
.search{position:relative;margin:8px 0 4px}
.search input{padding-left:42px;border-radius:14px;min-height:50px;background:var(--soft);border-color:transparent}
.search svg{position:absolute;left:14px;top:14px;width:22px;height:22px;stroke:var(--muted)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:disabled{opacity:.3;cursor:default}
.iconbtn svg{width:24px;height:24px;stroke:currentColor}
.item{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,#8a94a6);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.item .body{flex:1;min-width:0}
.item .txt{overflow-wrap:anywhere;font-size:16px}
html[data-ds=strike] .item.done .txt,html[data-ds=both] .item.done .txt,html[data-ds=strike] .wl.done .wx,html[data-ds=both] .wl.done .wx{text-decoration:line-through;color:var(--muted)}
html[data-ds=hl] .item.done .txt,html[data-ds=both] .item.done .txt,html[data-ds=hl] .wl.done .wx,html[data-ds=both] .wl.done .wx{background:color-mix(in srgb,#FFD43B 50%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,#FFD43B 50%,transparent);border-radius:4px;color:var(--ink)}
.wl.done{opacity:.65}
.evc.past,.wl.ev.past{opacity:.42;filter:grayscale(.75)}
.item.done .body,.item.done .chk{opacity:.6}
.item.inbox{background:var(--accent-soft);border-style:dashed;border-color:color-mix(in srgb,var(--accent) 40%,var(--line));border-left:5px dashed color-mix(in srgb,var(--accent) 60%,transparent)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--c,#8a94a6);flex:none;display:grid;place-items:center;background:transparent;margin-top:1px}
.chk.on{background:var(--c,#8a94a6)}
.chk svg{width:14px;height:14px;stroke:#fff;opacity:0}.chk.on svg{opacity:1}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--c,#8a94a6) 17%,var(--surface));color:color-mix(in srgb,var(--c,#8a94a6) 62%,var(--ink))}
.pill svg{width:12px;height:12px;stroke:currentColor}
.pill.plain{background:var(--soft);color:var(--muted)}
.pill.warn{background:var(--danger-soft);color:var(--danger)}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--line)}
.evc{display:flex;width:100%;align-items:stretch;border-radius:14px;overflow:hidden;background:color-mix(in srgb,var(--c) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));margin-bottom:8px}
.evt{min-width:74px;padding:12px 8px;display:grid;place-items:center;font:700 19px "Bricolage Grotesque",Figtree,sans-serif;color:color-mix(in srgb,var(--c) 70%,var(--ink));background:color-mix(in srgb,var(--c) 18%,var(--surface));font-variant-numeric:tabular-nums}
.evt.day{font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.evb{padding:10px 14px;flex:1;min-width:0}
.evb b{display:block;font-weight:600;overflow-wrap:anywhere}
.evb span{font-size:13px;color:color-mix(in srgb,var(--c) 60%,var(--muted));font-weight:600}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:15px;background:var(--soft);border-radius:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-align:center}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{flex:1;width:100%}
.cta{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;border-radius:16px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);margin-top:12px}
.cta b{display:block;font:700 17px "Bricolage Grotesque",Figtree,sans-serif}.cta span{font-size:14px;opacity:.9}
.cta svg{width:26px;height:26px;stroke:currentColor;flex:none}
.banner{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;margin-top:10px;border-radius:14px;background:var(--accent-soft);border:1px dashed color-mix(in srgb,var(--accent) 50%,var(--line));font-weight:600}
.banner .n{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:15px;min-height:40px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,#8a94a6);display:inline-block}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.chip.on.c{background:var(--c);border-color:var(--c);color:#fff}
.chip.on.c i{background:#fff}
.chip svg{width:16px;height:16px;stroke:currentColor}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:7px 10px;white-space:nowrap;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);text-align:center}
.cseg{display:grid;grid-auto-columns:1fr;width:100%}.cseg button{padding:8px 2px;font-size:13px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav .in{max-width:560px;margin:0 auto;display:grid;align-items:end}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);min-height:50px;font-weight:600;text-align:center}
nav button svg{width:24px;height:24px;stroke:currentColor}
nav button.on{color:var(--accent)}
nav .plus{margin-top:-24px;align-items:center}
nav .plus span{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent)}
nav .plus svg{width:28px;height:28px;stroke:var(--accent-ink)}
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-size:22px;margin:0 0 4px}
.okwrap{position:sticky;top:0;height:0;z-index:8;display:flex;justify-content:flex-end}.okfab{width:46px;height:46px;margin-top:-6px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}.okfab svg{width:24px;height:24px;stroke:#fff}.sheet h3,.okwrap~p.hint{padding-right:54px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 12px}
.field{margin:14px 0 0}.field>label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 2px 6px;text-transform:uppercase;letter-spacing:.5px}
.field label.btn{display:flex;text-transform:none;font-size:16px;letter-spacing:0;color:var(--ink);margin:0;font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:6px 2px 0}
.qa{display:flex;gap:8px;margin-top:10px}
.qa button{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);position:relative}
.qa button svg{width:24px;height:24px;stroke:currentColor}
.qa button.open{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.qa button.set{color:var(--ink);background:var(--soft)}
.qa button.set::after{content:'';position:absolute;top:8px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent))}
.panel{margin-top:10px;padding:12px;background:var(--soft);border-radius:14px}
.panel .lbl{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:12px;color:var(--muted);font-weight:700;padding:4px 0}
.cal button{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:15px;position:relative;min-height:42px;text-align:center}
.cal button.out{color:var(--muted);opacity:.5}
.cal button.today{border:1.5px solid var(--accent)}
.cal button.sel{background:var(--accent);color:var(--accent-ink)}
.cal button i{width:5px;height:5px;border-radius:50%;background:var(--danger);position:absolute;bottom:6px}
.cal button.sel i{background:var(--accent-ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week button{padding:8px 0;border-radius:14px;text-align:center;background:var(--surface);border:1px solid var(--line);position:relative}
.week button small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.week button b{font:700 19px "Bricolage Grotesque",Figtree,sans-serif}
.week button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.week button.sel small{color:var(--accent-ink);opacity:.85}
.week button.today:not(.sel){border-color:var(--accent)}
.week button i{width:5px;height:5px;border-radius:50%;background:var(--danger);position:absolute;bottom:4px;left:50%;margin-left:-2.5px}
.week button.sel i{background:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:50;max-width:90vw;text-align:center}
.photo-full{width:100%;border-radius:14px;margin-top:10px;border:1px solid var(--line)}
.demo{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;margin:16px 0 0}
.demo button{color:var(--accent);font-weight:700;text-decoration:underline}
.msg{padding:14px}.msg b{display:block;margin-bottom:4px}.msg p{margin:0 0 10px;white-space:pre-wrap;font-size:15px}
.hl{background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:4px;padding:0 2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.switch{width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.switch.on{background:var(--accent)}.switch.on::after{left:23px}
.setrow{display:flex;gap:14px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}.setrow:last-child{border-bottom:0}
.setrow .main{flex:1;min-width:0}.setrow small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;display:grid;place-items:center}.sw i{width:30px;height:30px;border-radius:50%;display:block}.sw.on{border-color:var(--ink)}
.dotbtn{width:34px;height:34px;border-radius:50%;background:var(--c);flex:none;border:3px solid color-mix(in srgb,var(--c) 30%,var(--surface))}
.sname{min-height:42px}
.soon{opacity:.55}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted)}
.link{color:var(--accent);font-weight:700;text-decoration:underline;padding:6px 0}
.wgrid{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}.wday{min-width:0}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px;min-height:92px;display:flex;flex-direction:column;gap:4px}
.wday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.wday.we{background:var(--soft)}
.wh{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}.wh b{font-size:15px}.wday.today .wh b{color:var(--accent)}
.wadd{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent)}.wadd svg{width:16px;height:16px;stroke:currentColor}
.wl{display:flex;gap:8px;align-items:flex-start;text-align:left;border:0;background:none;padding:5px 2px;font:inherit;font-size:14px;color:inherit;width:100%}
.wl.ev{border-left:3px solid var(--c);padding-left:8px;border-radius:3px}.wl .wt{flex:none;min-width:38px;font-size:12.5px;font-weight:700;color:var(--muted)}.wl.ev .wt{color:var(--c)}
.wl.tk .wt i{display:block;width:13px;height:13px;border:2px solid var(--muted);border-radius:50%;margin:2px 0 0 4px}.wl .wx{flex:1;min-width:0;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wempty{font-size:13px;color:var(--muted);padding:4px 2px}
.dz{border-radius:14px;padding:0 2px}.dz.over{background:var(--accent-soft);outline:2px solid var(--accent)}.dzempty{display:none;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted);font-size:14px;margin-bottom:8px}body.dnd .dzempty{display:block}
.item[data-drag]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.swipe[data-drag],.wl[data-drag]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.dragging{opacity:.3}.dghost{position:fixed;z-index:200;pointer-events:none;opacity:.95;box-shadow:0 10px 30px rgba(0,0,0,.28);border-radius:14px;background:var(--surface);transform:scale(1.03)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:150;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.12)}
.dock div{flex:1 1 90px;max-width:140px;text-align:center;padding:14px 6px;border-radius:12px;background:var(--soft);font-weight:700;font-size:14px}
.dock div.over,.wday.over,.cal button.over{background:var(--accent-soft);outline:2px solid var(--accent)}
.sheet.tall{min-height:94vh;min-height:94dvh;max-height:97vh;max-height:97dvh}
.bday{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:0 0 10px;border-radius:14px;background:color-mix(in srgb,#F06595 13%,var(--surface));border:1px solid color-mix(in srgb,#F06595 40%,var(--line))}.bday .cake{font-size:26px;line-height:1}.bday .body{display:flex;flex-direction:column}.bday span:not(.cake){font-size:13px;color:var(--muted)}
.rem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,#E5A100 14%,var(--surface));border:1px solid color-mix(in srgb,#E5A100 40%,var(--line));margin-bottom:8px}
.rem .body{flex:1;min-width:0}.rem b{display:block;overflow-wrap:anywhere}.rem span{font-size:13px;color:var(--muted);font-weight:600}.rem .btn{min-height:40px;padding:0 14px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gal button{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft)}.gal img{width:100%;height:100%;object-fit:cover;display:block}
.addrow{display:grid;place-items:center;width:42px;height:42px;margin:2px 0 6px auto;border-radius:50%;background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
.addrow svg{width:22px;height:22px;stroke:currentColor}
.swipe{position:relative;margin-bottom:8px;border-radius:14px;overflow:hidden}
.swipe .item,.swipe .evc{margin-bottom:0;position:relative;transition:transform .18s ease;touch-action:pan-y}
.swipe.moving .item,.swipe.moving .evc{transition:none}
.swipe:not(.open):not(.moving) .swdel{visibility:hidden}
.swdel{position:absolute;right:0;top:0;bottom:0;width:92px;background:var(--danger);color:#fff;font-weight:700;display:grid;place-items:center;text-align:center;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<nav><div class="in" id="nav"></div></nav>
<div id="layer"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

function parseWhen(text){
  const t=norm(text),now=new Date(),r={date:'',time:'',dateSpans:[],timeSpans:[]};let m;
  const wd=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  const mo=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const dm=(day,mi)=>{let d=new Date(now.getFullYear(),mi,day);if(d<t0)d=new Date(now.getFullYear()+1,mi,day);return ymd(d)};
  if(m=t.match(/\b(?:(?:a|vers|pour)\s+)?(\d{1,2})\s?h\s?(\d{2})?\b/)){r.time=pad(+m[1])+':'+(m[2]||'00');r.timeSpans.push([m.index,m[0].length])}
  const T=(re,fn)=>{const x=t.match(re);if(!x)return false;if(fn(x)===false)return false;r.dateSpans.push([x.index,x[0].length]);return true};
  T(/\b(?:pour\s+)?apres[ -]?demain\b/,()=>{r.date=ymd(addDays(now,2))})
  ||T(/\b(?:pour\s+)?demain(?:\s+(?:matin|soir|apres[- ]midi))?\b/,()=>{r.date=ymd(addDays(now,1))})
  ||T(/\b(?:pour\s+)?(?:aujourd.?hui|ce soir|ce matin|cet apres[- ]midi)\b/,()=>{r.date=ymd(now)})
  ||T(/\bdans (\d+|un|une|deux|trois|quatre|cinq|six|sept) jours?\b/,x=>{r.date=ymd(addDays(now,+x[1]||NUMW[x[1]]))})
  ||T(/\b(?:(?:pour|avant|vers)\s+)?(?:le\s+)?(\d{1,2})(?:er)?\s+(janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre)\b/,x=>{r.date=dm(+x[1],mo.indexOf(x[2]))})
  ||T(/\b(?:(?:pour|avant|vers)\s+)?(?:le\s+)?(\d{1,2})\/(\d{1,2})\b/,x=>{if(+x[2]<1||+x[2]>12)return false;r.date=dm(+x[1],+x[2]-1)})
  ||T(/\b(?:(?:pour|avant|vers)\s+)?(?:(?:ce|le)\s+)?(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)(?:\s+prochain)?\b/,x=>{let n=(wd.indexOf(x[1])-now.getDay()+7)%7;if(n===0)n=7;r.date=ymd(addDays(now,n))})
  ||T(/\b(?:pour\s+)?(?:la\s+)?semaine prochaine\b/,()=>{r.date=ymd(addDays(now,((8-now.getDay())%7)||7))});
  return r;
}
function cutText(text,spans){
  let x=text;[...spans].sort((a,b)=>b[0]-a[0]).forEach(([i,l])=>{x=x.slice(0,i)+' '+x.slice(i+l)});
  x=x.replace(/\s{2,}/g,' ').replace(/\s+([,.;:!?])/g,'$1').trim().replace(/(?:\s+(?:le|la|à|a|pour|avant|vers|de|du|ce|cet|et))+[,.]?$/i,'').replace(/^[,.;:\s]+|[,;:\s]+$/g,'').trim();
  return x?x.charAt(0).toUpperCase()+x.slice(1):'';
}

  const today=ymd(new Date());
  if(!n.due)return '';
  const d=fromYmd(n.due);
  if(n.due<today)return `<span class="pill warn">en retard · ${d.getDate()} ${MC[d.getMonth()]}</span>`;
  if(n.due===today)return '<span class="pill plain">aujourd’hui</span>';
  return `<span class="pill plain">${d.getDate()} ${MC[d.getMonth()]}</span>`;
}
function itemRow(n,q=''){
  const s=subj(n.subject),p=pupil(n.pupilId),c=colorOf(n);
  return `<div class="swipe" data-drag="n:${n.id}"><button class="swdel" data-act="delQuick" data-id="${n.id}">Supprimer</button><div class="item ${n.done?'done':''} ${n.inbox&&!n.done?'inbox':''}" style="--c:${c}">
    <button class="chk ${n.done?'on':''}" data-act="toggle" data-id="${n.id}" aria-label="Fait">${ICONS.check}</button>
    <button class="body" data-act="openNote" data-id="${n.id}">
      <div class="txt">${hl(n.text,q)}</div>
      <div class="pills">${n.inbox&&!n.done?'<span class="pill" style="--c:var(--accent)">à trier</span>':''}${p?`<span class="pill plain">${ICONS.person}${esc(p.name)}</span>`:''}${s?`<span class="pill">${esc(s.name)}</span>`:''}${n.done?`<span class="pill plain">fait le ${doneOn(n)?(d=>d.getDate()+' '+MC[d.getMonth()])(fromYmd(doneOn(n))):''}</span>`:(n.carried?'<span class="pill plain">reportée</span>':'')}${dueLabel(n)}</div>
    </button>${n.photo?`<img class="thumb" src="${n.photo}" alt="">`:''}</div></div>`;
}
const isPastEv=e=>{const now=new Date(),t=ymd(now);if(e.date<t)return true;if(e.date>t||!e.time)return false;const[h,m]=e.time.split(':').map(Number);return now.getHours()*60+now.getMinutes()>=h*60+m+30};
const doneOn=n=>n.doneDay||(n.doneAt?ymd(new Date(n.doneAt)):(n.due||''));
function rollover(){if(S.settings.rollover===false)return;const t=ymd(new Date());let ch=false;S.notes.forEach(n=>{if(!n.done&&!n.inbox&&n.due&&n.due<t){n.due=t;n.carried=(n.carried||0)+1;ch=true}});if(ch)persist()}
const doneLast=(a,b)=>(a.done?1:0)-(b.done?1:0);
function eventCard(e,q=''){
  const [lab,c]=EV[e.kind]||EV.autre;
  return `<div class="swipe" data-drag="e:${e.id}"><button class="swdel" data-act="delQuickE" data-id="${e.id}">Supprimer</button><button class="evc ${isPastEv(e)?'past':''}" style="--c:${c}" data-act="openEvent" data-id="${e.id}"><div class="evt ${e.time?'':'day'}">${e.time||'Jour'}</div><div class="evb"><b>${hl(e.title,q)}</b><span>${lab}${pupil(e.pupilId)?' · '+esc(pupil(e.pupilId).name):''}${e.date!==ymd(new Date())?' · '+frDate(fromYmd(e.date)):''}</span></div></button></div>`;
}

function vToday(){
  const now=new Date(),today=ymd(now),q=qToday.trim(),M=S.settings.modules;
  const isT=tDay===today,sel=fromYmd(tDay),mon=addDays(sel,-((sel.getDay()+6)%7));
  const has=k=>S.events.some(e=>e.date===k)||S.notes.some(n=>n.due===k&&!n.done&&!n.inbox);
  let h=`<div class="top"><div><h1>${cap(frDate(sel))}</h1><p class="sub">${isT?'Tout ce qui compte pour aujourd’hui.':'<button class="link" data-act="tday" data-v="'+today+'">Revenir à aujourd’hui</button>'}</p></div>${gear()}</div>
    <div class="top" style="margin:4px 0 6px;align-items:center"><button class="iconbtn" data-act="tshift" data-v="-7" aria-label="Semaine précédente">${ICONS.back}</button><b style="font-size:14px;color:var(--muted)">Semaine du ${mon.getDate()} ${MOIS[mon.getMonth()]}</b><button class="iconbtn" data-act="tshift" data-v="7" aria-label="Semaine suivante">${ICONS.chev}</button></div>
    <div class="week">${Array.from({length:7},(_,i)=>{const d=addDays(mon,i),k=ymd(d);return `<button class="${k===tDay?'sel':''} ${k===today?'today':''}" data-act="tday" data-v="${k}"><small>${J3[i]}</small><b>${d.getDate()}</b>${has(k)?'<i></i>':''}</button>`}).join('')}</div>
    <div class="search">${ICONS.search}<input id="q" type="search" placeholder="Retrouver une info…" value="${esc(qToday)}" autocomplete="off"></div>`;
  if(q){
    const r=searchAll(q),total=r.notes.length+r.events.length+r.pupils.length;
    h+=`<h2>${total} résultat${total>1?'s':''}</h2>`;
    if(!total)return h+'<div class="empty">Rien trouvé. Essaie un autre mot (« père », « mail », « signer »).</div>';
    if(r.notes.length)h+=r.notes.map(n=>itemRow(n,q)).join('');
    if(r.events.length)h+='<h2>Événements</h2>'+r.events.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>eventCard(e,q)).join('');

    return h;
  }
  const open=S.notes.filter(n=>!n.done),inbox=open.filter(n=>n.inbox),sorted=open.filter(n=>!n.inbox);
  const beforeLeft=sorted.filter(n=>n.before).length;
  S.pupils.filter(p=>p.birth&&p.birth.slice(-5)===tDay.slice(5)).forEach(p=>{h+=`<div class="bday"><span class="cake">🎂</span><div class="body"><b>Anniversaire de ${esc(p.name)}</b>${p.birth.length===10?'<span>'+agoYears(p.birth,tDay)+' ans</span>':''}</div></div>`});
  if(isT){const R=reminders();if(R.length)h+=`<h2>Rappels <span class="n">${R.length}</span></h2>`+R.map(r=>`<div class="rem"><div class="body"><b>${esc(r.title)}</b><span>${r.when}</span></div><button class="btn ghost" data-act="seen" data-v="${r.kind}" data-id="${r.id}">Vu</button></div>`).join('')}
  if(isT&&(now.getDay()===5||now.getDay()===6||now.getDay()===0))h+=`<button class="banner" data-act="bilan">Faire le bilan de la semaine</button>`;
  if(M.notes&&inbox.length&&isT)h+=`<button class="banner" data-act="view" data-v="todo"><span class="n">${inbox.length}</span> note${inbox.length>1?'s':''} à trier</button>`;
  if(M.agenda){
    const ev=S.events.filter(e=>e.date===tDay).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
    h+=`<h2>Événements <span class="n">${ev.length}</span></h2>`+(ev.length?ev.map(e=>eventCard(e)).join(''):'<div class="empty">Aucun événement '+(isT?'aujourd’hui':'ce jour-là')+'.</div>');
    h+=`<button class="addrow" data-act="addEventDay" aria-label="Ajouter un événement">${ICONS.plus}</button>`;
  }
  const pool=S.notes.filter(n=>!n.inbox&&!n.done);
  const todo=[...pool.filter(n=>isT?(n.due&&n.due<=today):n.due===tDay),...S.notes.filter(n=>n.done&&!n.inbox&&doneOn(n)===tDay)].sort((a,b)=>doneLast(a,b)||(b.before-a.before)||a.due.localeCompare(b.due)||b.ts-a.ts);
  h+=`<h2>À faire <span class="n">${todo.filter(n=>!n.done).length}</span></h2>`+(todo.length?todo.map(n=>itemRow(n)).join(''):'<div class="empty">'+(isT?'Tout est fait pour aujourd’hui.':'Rien de prévu ce jour-là.')+'</div>');
  h+=`<button class="addrow" data-act="addTask" aria-label="Ajouter une tâche">${ICONS.plus}</button>`;
  if(isT){
    const tm=ymd(addDays(now,1)),end=ymd(addDays(now,7));
    const arr=[...S.events.filter(e=>e.date>today&&e.date<=end).map(e=>({d:e.date,t:e.time||'97',h:eventCard(e)})),...pool.filter(n=>n.due>today&&n.due<=end).map(n=>({d:n.due,t:'98',h:itemRow(n)}))].sort((a,b)=>a.d.localeCompare(b.d)||a.t.localeCompare(b.t));
    if(arr.length)h+=`<h2>Cette semaine <span class="n">${arr.length}</span></h2>`+arr.map(x=>x.h).join('');

  return h;
}

function vTodo(){
  const q=qTodo.trim(),today=ymd(new Date()),wkEnd=ymd(addDays(new Date(),7));
  let list=S.notes.slice();
  if(fSubj==='none')list=list.filter(n=>!n.subject);else if(fSubj)list=list.filter(n=>n.subject===fSubj);
  if(q)list=list.filter(n=>matchNote(n,q));
  const open=list.filter(n=>!n.done),done=list.filter(n=>n.done&&!(doneOn(n)===today&&!n.inbox));
  const inbox=open.filter(n=>n.inbox).sort((a,b)=>b.ts-a.ts),rest=open.filter(n=>!n.inbox),doneToday=list.filter(n=>n.done&&!n.inbox&&doneOn(n)===today);
  const g=[['En retard',rest.filter(n=>n.due&&n.due<today),true],['Aujourd’hui',[...rest.filter(n=>n.due===today),...doneToday],false],['Cette semaine',rest.filter(n=>n.due>today&&n.due<=wkEnd),false],['Plus tard',rest.filter(n=>n.due>wkEnd),false],['Sans date',rest.filter(n=>!n.due),false]];
  const totalOpen=S.notes.filter(n=>!n.done).length;
  let h=`<div class="top"><div><h1>À faire</h1><p class="sub">${totalOpen} à faire · ${S.notes.filter(n=>n.inbox&&!n.done).length} à trier</p></div>${gear()}</div>
  <div class="search">${ICONS.search}<input id="qt" type="search" placeholder="Chercher dans mes notes…" value="${esc(qTodo)}" autocomplete="off"></div>
  <div class="chips scroll" style="margin-top:10px"><button class="chip ${!fSubj?'on':''}" data-act="tfilter" data-v="">Tout</button>${S.subjects.map(s=>`<button class="chip c ${fSubj===s.id?'on':''}" style="--c:${s.color}" data-act="tfilter" data-v="${s.id}"><i></i>${esc(s.name)}</button>`).join('')}<button class="chip ${fSubj==='none'?'on':''}" data-act="tfilter" data-v="none">Sans matière</button></div>`;
  if(inbox.length)h+=`<h2>À trier <span class="n">${inbox.length}</span></h2><p class="hint" style="margin:-4px 2px 10px">Touche une note pour la ranger : élève, matière, date.</p>`+inbox.map(n=>itemRow(n,q)).join('');
  const gd=[null,today,dueFor('week'),ymd(addDays(new Date(),14)),''];
  g.forEach(([lab,arr,warn],gi)=>{const zone=gd[gi]!==null&&!q;if(!arr.length&&!zone)return;if(warn&&!arr.some(n=>!n.done))return;
    const inner=`<h2 class="${warn?'late':''}">${lab} <span class="n">${arr.filter(n=>!n.done).length}</span></h2>`+arr.sort((a,b)=>doneLast(a,b)||(a.due||'9').localeCompare(b.due||'9')||b.ts-a.ts).map(n=>itemRow(n,q)).join('')+(arr.length?'':'<div class="dzempty">Déposer ici</div>');
    h+=zone?`<div class="dz" data-zone="1" data-drop="${gd[gi]}">${inner}</div>`:inner});
  if(!inbox.length&&!rest.some(n=>!n.done))h+='<div class="empty" style="margin-top:16px">Rien à faire ici. Appuie sur + pour noter quelque chose.</div>';
  if(done.length){h+=`<h2><button class="link" data-act="toggleDone">${showDone?'Masquer':'Voir'} les terminées (${done.length})</button></h2>`;if(showDone)h+=done.sort((a,b)=>b.ts-a.ts).map(n=>itemRow(n,q)).join('')}
  return h;

function vAgenda(){

  let h=`<div class="top"><div><h1>Ressources</h1><p class="sub">${S.res.length} lien${S.res.length>1?'s':''} gardé${S.res.length>1?'s':''}</p></div>${gear()}</div>

  if(!list.length)return h+'<div class="empty">'+(S.res.length?'Rien trouvé.':'Colle ici les liens des sites où tu trouves des ressources.')+'</div>';
  return h+list.map(r=>{const sj=subj(r.subject);let host=r.url;try{host=new URL(/^https?:/.test(r.url)?r.url:'https://'+r.url).hostname.replace(/^www\./,'')}catch(e){}

function render(){
  swOpen=null;rollover();
  const m=S.settings.modules;
  if((view==='agenda'&&!m.agenda)||(view==='todo'&&!m.notes)||(view==='class'&&!m.class&&!m.ideas&&!m.infos&&!m.res&&!m.rec))view='today';
  $('#app').innerHTML={today:vToday,agenda:vAgenda,todo:vTodo,class:vClass,settings:vSettings}[view]();
  const tabs=[['today','Aujourd’hui']];
  if(m.agenda)tabs.push(['agenda','Agenda']);
  if(m.notes)tabs.push(['todo','À faire']);
  if(m.class||m.ideas||m.infos||m.res||m.rec)tabs.push(['class','Classe']);
  tabs.splice(Math.ceil(tabs.length/2),0,['add','']);
  $('#nav').style.gridTemplateColumns='repeat('+tabs.length+',1fr)';
  $('#nav').innerHTML=tabs.map(([k,l])=>k==='add'?`<button class="plus" data-act="capture" aria-label="Noter vite"><span>${ICONS.plus}</span></button>`:`<button class="${view===k?'on':''}" data-act="view" data-v="${k}">${ICONS[k==='class'&&!m.class?'msgs':k]}${l}</button>`).join('');
  renderSheet();
}

function resHTML(q){
  if(!q)return '<p class="hint" style="margin-top:14px">Tape quelques lettres : une tâche, un événement ou un prénom d’élève.</p>';
  const r=searchAll(q),total=r.notes.length+r.events.length+r.pupils.length;
  if(!total)return '<div class="empty" style="margin-top:14px">Rien trouvé. Essaie un autre mot.</div>';
  let h=`<h2>${total} résultat${total>1?'s':''}</h2>`;
  if(r.events.length)h+='<h2 style="margin-top:6px">Événements</h2>'+r.events.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>eventCard(e,q)).join('');
  if(r.notes.length)h+='<h2 style="margin-top:6px">Tâches et notes</h2>'+r.notes.map(n=>itemRow(n,q)).join('');
  if(r.pupils.length)h+='<h2 style="margin-top:6px">Élèves</h2>'+card(r.pupils.map(p=>`<div class="setrow"><button class="main" data-act="pupil" data-id="${p.id}"><b>${hl(p.name,q)}</b><small>${p.notes.length} note${p.notes.length>1?'s':''}</small></button></div>`).join(''));
  return h;
}
function openSheet(s){sheet=s;renderSheet()}

const WHEN=[['today','Aujourd’hui'],['tomorrow','Demain'],['week','Cette semaine']];

  if(open==='subject')panel=`<div class="panel"><div class="lbl">Quelle matière ?</div><div class="chips"><button class="chip ${!d.subject?'on':''}" data-act="setSubject" data-v="">Aucune</button>${S.subjects.map(x=>`<button class="chip c ${d.subject===x.id?'on':''}" style="--c:${x.color}" data-act="setSubject" data-v="${x.id}"><i></i>${esc(x.name)}</button>`).join('')}</div></div>`;
  if(open==='when')panel=`<div class="panel"><div class="lbl">Pour quand ?</div><div class="chips">${WHEN.map(([k,l])=>`<button class="chip ${d.when===k&&!d.date?'on':''}" data-act="setWhen" data-v="${k}">${l}</button>`).join('')}<button class="chip ${!d.when&&!d.date?'on':''}" data-act="setWhen" data-v="">Pas de date</button></div>
    <div style="margin-top:10px"><div class="lbl" style="margin-bottom:4px">Ou une date précise</div><input id="nd" type="date" value="${d.date||''}"></div>
    ${d.isEvent?`<div style="margin-top:14px"><div class="lbl" style="margin-bottom:4px">Heure (facultatif)</div><input id="nh" type="time" value="${d.time||''}"></div>`:''}
    <div class="lbl" style="margin-top:14px">Rappel</div><div class="chips">${REM.map(([v,l])=>`<button class="chip ${String(d.remind)===v?'on':''}" data-act="setRemind" data-v="${v}">${l}</button>`).join('')}</div>
    ${isNew&&(d.when||d.date)?`<div class="chips" style="margin-top:12px"><button class="chip ${d.repeat?'on':''}" data-act="tgRepeat">Répéter chaque semaine</button></div>`:''}</div>`;
  if(open==='photo'&&S.settings.modules.photos)panel=`<div class="panel"><div class="lbl">Photo</div><label class="btn ghost block" for="ph" style="cursor:pointer">${d.photo?'Changer la photo':'Prendre ou choisir une photo'}</label><input id="ph" type="file" accept="image/*" class="sr">${d.photo?`<img class="photo-full" src="${d.photo}" alt="Photo jointe">`:''}</div>`;
  const wl=d.date?(()=>{const x=fromYmd(d.date);return x.getDate()+' '+MC[x.getMonth()]})():((WHEN.find(w=>w[0]===d.when)||[])[1]||'');
  const summary=[p?`<span class="pill plain">${ICONS.person}${esc(p.name)}</span>`:'',s?`<span class="pill" style="--c:${s.color}">${esc(s.name)}</span>`:'',wl?`<span class="pill plain">${wl}${d.isEvent&&d.time?' · '+d.time:''}</span>`:'',d.isEvent?'<span class="pill plain">événement</span>':'',d.obs?'<span class="pill plain">observation</span>':''].join('');
  return `<div class="field" style="margin-top:6px"><textarea id="nt" placeholder="Écris ou dicte avec le micro du clavier…" aria-label="Note">${esc(d.text)}</textarea></div>

  ${summary?`<div class="pills" style="margin-top:10px">${summary}</div>`:''}${panel}`;

function renderSheet(){
  const L=$('#layer');
  if(!sheet){L.innerHTML='';return}
  let body='';
  if(sheet.type==='note'){
    const d=sheet.d,isNew=!d.id;
    body=`<div class="grab"></div><h3>${isNew?'Noter vite':(d.inbox?'Ranger cette note':'Modifier la note')}</h3>
    ${isNew?'<p class="hint" style="margin:2px 2px 0">Écris ou dicte quelques mots. Un prénom d’élève ou une date (« jeudi », « le 3 décembre ») est reconnu tout seul.</p>':(d.suggested?'<p class="hint" style="margin:2px 2px 0">Préremplie d’après les mots de la note. Vérifie avant de ranger.</p>':'')}
    ${noteForm(d)}
    <div style="display:flex;gap:10px;margin-top:18px">${isNew?'<button class="btn ghost" data-act="close">Annuler</button>':'<button class="btn danger" data-act="delNote" data-id="'+d.id+'">Supprimer</button>'}<button class="btn block" data-act="saveNote">${isNew?'Enregistrer':(d.inbox?'Ranger':'Enregistrer')}</button></div>
    ${isNew?'':`<button class="btn ghost block" style="margin-top:10px" data-act="doneNote" data-id="${d.id}">${d.done?'Remettre à faire':'C’est fait'}</button>`}`;
  }else if(sheet.type==='bilan'){
    const now=new Date(),dow=(now.getDay()+6)%7,nm=addDays(now,7-dow),ne=addDays(nm,6),a=ymd(nm),b=ymd(ne);
    const left=S.notes.filter(n=>!n.done&&!n.inbox),ev=S.events.filter(e=>e.date>=a&&e.date<=b).sort((x,y)=>x.date.localeCompare(y.date)||(x.time||'').localeCompare(y.time||''));
    const pup=S.pupils.map(p=>({p,c:left.filter(n=>n.pupilId===p.id).length+ev.filter(e=>e.pupilId===p.id).length})).filter(x=>x.c);
    body=`<div class="grab"></div><h3>Bilan de la semaine</h3>
    <h2>Encore à faire <span class="n">${left.length}</span></h2>${left.length?left.map(n=>itemRow(n)).join(''):'<div class="empty">Tout est fait. Bon week-end !</div>'}
    <h2>Semaine prochaine <span class="n">${ev.length}</span></h2>${ev.length?ev.map(e=>eventCard(e)).join(''):'<div class="empty">Rien de prévu pour l’instant.</div>'}
    ${pup.length?'<h2>Élèves à suivre</h2>'+card(pup.map(x=>`<div class="setrow"><button class="main" data-act="pupil" data-id="${x.p.id}"><b>${esc(x.p.name)}</b><small>${x.c} à venir</small></button></div>`).join('')):''}
    <div style="display:flex;gap:10px;margin-top:18px"><button class="btn ghost" data-act="close">Fermer</button>${left.some(n=>n.due&&n.due<ymd(nm))?'<button class="btn" data-act="reportMon">Reporter les retards à lundi</button>':''}</div>`;
  }else if(sheet.type==='search'){
    body=`<div class="grab"></div><h3>Rechercher</h3><div class="search">${ICONS.search}<input id="gq" type="search" placeholder="Une tâche, un événement, un élève…" autocomplete="off" value="${esc(sheet.q||'')}"></div><div id="gres">${resHTML((sheet.q||'').trim())}</div><button class="btn ghost block" style="margin-top:14px" data-act="close">Fermer</button>`;
  }else if(sheet.type==='photo'){
    const n=S.notes.find(x=>x.id===sheet.id);if(!n||!n.photo){sheet=null;L.innerHTML='';return}
    body=`<div class="grab"></div><h3>Photo</h3><img class="photo-full" src="${n.photo}" alt=""><p class="sub" style="margin-top:10px">${esc(n.text)}</p><div style="display:flex;gap:10px"><button class="btn danger" data-act="delPhoto" data-id="${n.id}">Supprimer la photo</button><button class="btn block" data-act="close">Fermer</button></div><button class="btn ghost block" style="margin-top:10px" data-act="openNote" data-id="${n.id}">Ouvrir la note</button>`;
  }else if(sheet.type==='event'){
    const e=sheet.d;
    body=`<div class="grab"></div><h3>${e.id?'Événement':'Nouvel événement'}</h3>
    <div class="field"><label for="et">Titre</label><input id="et" value="${esc(e.title)}" placeholder="Ex. Réunion parents" autocomplete="off"></div>
    <div class="field"><label for="ed">Date</label><input id="ed" type="date" value="${e.date}"></div>
    <div class="field"><label for="eh">Heure (facultatif)</label><input id="eh" type="time" value="${e.time||''}"></div>
    <div class="field"><label>Type</label><div class="chips">${Object.entries(EV).map(([k,[l,c]])=>`<button class="chip c ${e.kind===k?'on':''}" style="--c:${c}" data-act="ekind" data-v="${k}"><i></i>${l}</button>`).join('')}</div></div>
    ${S.pupils.length?`<div class="field"><label>Élève</label><div class="chips"><button class="chip ${!e.pupilId?'on':''}" data-act="epupil" data-v="">Aucun</button>${S.pupils.slice().sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(x=>`<button class="chip ${e.pupilId===x.id?'on':''}" data-act="epupil" data-v="${x.id}">${ICONS.person}${esc(x.name)}</button>`).join('')}</div></div>`:''}
    <div class="field"><label>Rappel</label><div class="chips">${REM.map(([v,l])=>`<button class="chip ${String(e.remind??'')===v?'on':''}" data-act="erem" data-v="${v}">${l}</button>`).join('')}</div></div>
    ${e.id?'':`<div class="chips" style="margin-top:4px"><button class="chip ${e.repeat?'on':''}" data-act="erepeat">Répéter chaque semaine</button></div>`}
    <div style="display:flex;gap:10px;margin-top:20px">${e.id?'<button class="btn danger" data-act="delEvent">Supprimer</button>':'<button class="btn ghost" data-act="close">Annuler</button>'}<button class="btn block" data-act="saveEvent">Enregistrer</button></div>`;
  }else if(sheet.type==='pupil'){
    const p=pupil(sheet.id);if(!p){sheet=null;L.innerHTML='';return}
    const pn=S.settings.modules.pupilNotes,f=sheet.f;

function newDraft(){return {text:'',tag:'',subject:'',pupilId:'',when:'',date:'',photo:null,panel:'',done:false,isEvent:false,todo:true,time:'',remind:'',repeat:false}}
function readNote(){
  if(!sheet||sheet.type!=='note')return;
  const t=$('#nt');if(t)sheet.d.text=t.value;
  const n=$('#nd');if(n){sheet.d.date=n.value;if(n.value)sheet.d.when=''}
  const h=$('#nh');if(h)sheet.d.time=h.value;
}
function readPupil(){if(!sheet||sheet.type!=='pupil')return;const t=$('#pn');if(t)sheet.f.text=t.value;const d=$('#pd');if(d){sheet.f.date=d.value;if(d.value&&sheet.f.type==='todo')sheet.f.when=''}const tm=$('#pt');if(tm)sheet.f.time=tm.value}
function fmtBirth(b){return b&&b.length===10?b.slice(8)+'/'+b.slice(5,7)+'/'+b.slice(0,4):''}
function parseBirth(t){const d=String(t||'').replace(/\D/g,'');if(d.length!==8)return null;const D=+d.slice(0,2),M=+d.slice(2,4),Y=+d.slice(4);if(M<1||M>12||D<1||Y<1990||Y>new Date().getFullYear()+1)return null;const dt=new Date(Y,M-1,D);if(dt.getMonth()!==M-1)return null;return ymd(dt)}
function parseDMY(t){const d=String(t||'').replace(/\D/g,'');if(d.length!==8)return null;const D=+d.slice(0,2),M=+d.slice(2,4),Y=+d.slice(4);if(M<1||M>12||D<1||Y<2000||Y>2100)return null;const dt=new Date(Y,M-1,D);return dt.getMonth()===M-1?dt:null}
function agoYears(b,at){const y=+b.slice(0,4),d=at?fromYmd(at):new Date(),a=d.getFullYear()-y;return a}
function resizeImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const m=900,s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(file)})}
function weeklyCopies(ev,n){for(let i=1;i<=n;i++)S.events.push({...ev,id:uid(),date:ymd(addDays(fromYmd(ev.date),7*i))})}
function icsOf(e,rep){
  const d=e.date.replace(/-/g,''),esc2=t=>String(t).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n'),pd=n=>String(n).padStart(2,'0');
  let st,en;
  if(e.time){const[h,m]=e.time.split(':').map(Number),eh=(h+1)%24;st=`DTSTART:${d}T${pd(h)}${pd(m)}00`;en=`DTEND:${d}T${pd(eh)}${pd(m)}00`}
  else{st=`DTSTART;VALUE=DATE:${d}`;en=`DTEND;VALUE=DATE:${ymd(addDays(fromYmd(e.date),1)).replace(/-/g,'')}`}
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Marge//FR','BEGIN:VEVENT','UID:'+uid()+'@marge',`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,st,en,'SUMMARY:'+esc2(e.title)];
  if(rep)L.push('RRULE:FREQ=WEEKLY');
  if(e.time)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc2(e.title),'TRIGGER:PT0M','END:VALARM');
  L.push('END:VEVENT','END:VCALENDAR');return L.join('\r\n');
}

  openEvent:(v,id)=>{const e=S.events.find(x=>x.id===id);if(e)openSheet({type:'event',d:{...e}})},
  erepeat:()=>{const e=sheet.d;e.title=$('#et').value;e.date=$('#ed').value;e.time=$('#eh').value;e.repeat=!e.repeat;renderSheet()},
  ics:async()=>{const e=sheet.d;e.title=$('#et').value.trim();e.date=$('#ed').value;e.time=$('#eh').value;if(!e.title||!e.date){toast('Titre et date d’abord');return}

  ekind:v=>{const e=sheet.d;e.title=$('#et').value;e.date=$('#ed').value;e.time=$('#eh').value;e.kind=v;renderSheet()},
  saveEvent:()=>{const e=sheet.d;e.title=$('#et').value.trim();e.date=$('#ed').value;e.time=$('#eh').value;if(!e.title||!e.date){toast('Titre et date d’abord');return}
    if(e.id){const i=S.events.findIndex(x=>x.id===e.id);S.events[i]={...e}}else{const ne={...e,id:uid()};delete ne.repeat;S.events.push(ne);if(e.repeat)weeklyCopies(ne,9)}

  savePupilNote:(v,id)=>{
    readPupil();const p=pupil(id),f=sheet.f,t=f.text.trim(),ty=f.type||'note';
    if(!p||!t){toast('Écris quelques mots d’abord');return}

    else if(ty==='todo'){const n={id:uid(),text:t,tag:'eleve',ts:Date.now(),before:false,done:false,due:f.date?f.date:dueFor(f.when),photo:null,subject:'',pupilId:p.id,inbox:false};S.notes.unshift(n);syncPupil(n);toast('Ajouté à « À faire »')}
    else{p.notes.push({ts:Date.now(),text:t});toast('Observation enregistrée')}
    sheet.f={type:ty,text:'',when:'',date:'',time:''};persist();renderSheet();render();
  },
  ptype:v=>{readPupil();sheet.f.type=v;sheet.f.date='';sheet.f.when='';renderSheet()},
  delObs:(v,id)=>{let pid=sheet&&sheet.type==='pupil'?sheet.id:sheet&&sheet.d&&sheet.d.pid,key=id||(sheet.d&&String(sheet.d.ts)),pu=pupil(pid);if(!pu)return;pu.notes=pu.notes.filter(x=>!(String(x.ts)===String(key)&&!x.noteId));persist();toast('Supprimée · touche ↩ pour annuler');if(sheet.type==='obs')ACT.backPupil();else renderSheet();render()},
  delPupil:(v,id)=>{S.pupils=S.pupils.filter(x=>x.id!==id);S.notes.forEach(n=>{if(n.pupilId===id)n.pupilId=''});S.events.forEach(e=>{if(e.pupilId===id)e.pupilId=''});persist();sheet=null;render()},
  copy:(v,id)=>doCopy(id,false),share:(v,id)=>doCopy(id,true),
  editTpl:(v,id)=>{const t=S.templates.find(x=>x.id===id);if(t)openSheet({type:'tpl',d:{...t}})},
  newTpl:()=>openSheet({type:'tpl',d:{title:'',text:''}}),
  saveTpl:()=>{const t=sheet.d;t.title=$('#tt').value.trim();t.text=$('#tx').value;if(!t.title||!t.text.trim()){toast('Titre et message d’abord');return}
    if(t.id){const i=S.templates.findIndex(x=>x.id===t.id);S.templates[i]={...t}}else S.templates.push({...t,id:uid()});persist();sheet=null;render();toast('Modèle enregistré')},
  delTpl:()=>{if(confirm('Supprimer ce modèle ?')){S.templates=S.templates.filter(x=>x.id!==sheet.d.id);persist();sheet=null;render()}},

  th:v=>{S.settings.theme=v;applyTheme();persist();render()},

  pickColor:(v,id)=>{openColor=openColor===id?'':id;render()},
  setColor:(v,id)=>{const s=subj(id);if(s){s.color=v;openColor='';persist();render()}},
  cycleColor:(v,id)=>{const s=subj(id);if(s){const i=PALETTE.indexOf(s.color);s.color=PALETTE[(i+1)%PALETTE.length];persist();render()}},
  addSubject:()=>{const used=S.subjects.map(s=>s.color);S.subjects.push({id:uid(),name:'Nouvelle matière',color:PALETTE.find(c=>!used.includes(c))||PALETTE[0]});persist();render()},
  delSubject:(v,id)=>{if(confirm('Supprimer cette matière ? Les notes restent, sans matière.')){S.subjects=S.subjects.filter(s=>s.id!==id);S.notes.forEach(n=>{if(n.subject===id)n.subject=''});persist();render()}},
  clearDemo:()=>{S=blank();persist();render();toast('Données de démonstration effacées')},
  export:async()=>{const json=JSON.stringify(S,null,1);try{const f=new File([json],'marge-copie.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}try{const b=new Blob([json],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='marge-copie.json';a.click()}catch(e){toast('Copie impossible ici')}},
  reset:()=>{if(confirm('Tout effacer sur cet appareil ?')){S=blank();persist();sheet=null;render()}}

function doCopy(id,share){
  const tp=S.templates.find(x=>x.id===id);if(!tp)return;
  const txt=tp.text.replace(/\{prénom\}/g,window._who||'votre enfant');
  if(share&&navigator.share){navigator.share({text:txt}).catch(()=>{});return}
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Copié')).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copié')}catch(e){toast('Copie impossible')}ta.remove()});
}
const MUT=new Set(['delObs','saveObs','addIdea','saveIdea','delIdea','saveRes','delRes','reportMon','setColor','toggle','saveNote','delNote','doneNote','saveEvent','delEvent','savePupilNote','addPupil','delPupil','saveTpl','delTpl','delPhoto','delRec','addRec','addSubject','delSubject','cycleColor','clearDemo','reset','delQuick','delQuickE','seen','mod','opt']);
let swJust=false;
setInterval(()=>{const a=document.activeElement;if(window._dragging||sheet||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))return;try{render()}catch(e){}},60000);
function convertTo(kind,id,target){
  const pu=sheet&&sheet.type==='pupil'?pupil(sheet.id):null;if(!pu)return;
  const same=(kind==='n'&&target==='todo')||(kind==='e'&&target==='event')||(kind==='o'&&target==='note');if(same)return;
  let text='',due='',ts=0;
  if(kind==='n'){const n=S.notes.find(x=>x.id===id);if(!n)return;text=n.text;due=n.due||''}
  else if(kind==='e'){const e=S.events.find(x=>x.id===id);if(!e)return;text=e.title;due=e.date}
  else{const o=pu.notes.find(x=>String(x.ts)===id&&!x.noteId);if(!o)return;text=o.text}
  if(target==='event'&&!due){toast('Un événement a besoin d’une date : utilise « Ajouter » en bas');return}
  hist.push(JSON.stringify(S));if(hist.length>20)hist.shift();redo=[];
  if(kind==='n'){S.notes=S.notes.filter(x=>x.id!==id);pu.notes=pu.notes.filter(x=>x.noteId!==id)}
  else if(kind==='e')S.events=S.events.filter(x=>x.id!==id);
  else pu.notes=pu.notes.filter(x=>!(String(x.ts)===id&&!x.noteId));
  if(target==='todo'){const n={id:uid(),text,tag:'eleve',ts:Date.now(),before:false,done:false,due:kind==='e'?due:due,photo:null,subject:'',pupilId:pu.id,inbox:false};S.notes.unshift(n);syncPupil(n)}
  else if(target==='note')pu.notes.push({ts:Date.now(),text});
  else S.events.push({id:uid(),title:text,pupilId:pu.id,date:due,time:'',kind:'rdv',remind:''});
  persist();render();renderSheet();toast('Déplacé');
}
(function(){
  let dg=null,timer=null,ghost=null,dock=null,raf=0,lastY=0,lastOver=null;
  const iso=d=>ymd(d);
  const chips=ev=>{const t=new Date(),T=iso(t),nm=iso(addDays(t,7-((t.getDay()+6)%7)));
    const a=[['Aujourd’hui',T],['Demain',iso(addDays(t,1))],['Cette semaine',dueFor('week')],['Sem. prochaine',nm]];if(!ev)a.push(['Sans date','']);return a};
  const dropOf=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest('[data-drop]')};
  function cleanup(){document.body.classList.remove('dnd');clearTimeout(timer);timer=null;cancelAnimationFrame(raf);window._dragging=false;if(ghost){ghost.remove();ghost=null}if(dock){dock.remove();dock=null}
    document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));dg=null;lastOver=null}
  function begin(){
    if(!dg)return;const src=dg.src,r=src.getBoundingClientRect();window._dragging=true;dg.active=true;document.body.classList.add('dnd');
    ghost=src.cloneNode(true);ghost.classList.add('dghost');ghost.classList.remove('dragging');ghost.style.width=r.width+'px';ghost.style.left=r.left+'px';ghost.style.top=r.top+'px';ghost.dataset.drag='';document.body.appendChild(ghost);
    src.classList.add('dragging');dg.ox=dg.x-r.left;dg.oy=dg.y-r.top;
    if(!document.querySelector('[data-zone]')){dock=document.createElement('div');dock.className='dock';dock.innerHTML=chips(dg.kind==='e').map(([l,d])=>`<div data-drop="${d}">${l}</div>`).join('');document.body.appendChild(dock)}
    try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
    const loop=()=>{if(!dg||!dg.active)return;const h=innerHeight,sc=document.querySelector('.sheet')||window,by=d=>sc===window?scrollBy(0,d):(sc.scrollTop+=d);if(lastY<90)by(-14);else if(lastY>h-110)by(14);raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop);
  }
  document.addEventListener('pointerdown',e=>{
    if(e.target.closest('.chk,.swdel,input,textarea,a,select'))return;
    const src=e.target.closest('[data-drag]');if(!src||!src.dataset.drag)return;
    const [k,id]=src.dataset.drag.split(':');if(e.pointerType==='mouse'&&e.button!==0)return;
    dg={src,kind:k,id,x:e.clientX,y:e.clientY,active:false};timer=setTimeout(begin,380);
  });
  document.addEventListener('pointermove',e=>{
    if(!dg)return;
    if(!dg.active){if(Math.hypot(e.clientX-dg.x,e.clientY-dg.y)>9){clearTimeout(timer);dg=null}return}
    lastY=e.clientY;ghost.style.left=(e.clientX-dg.ox)+'px';ghost.style.top=(e.clientY-dg.oy)+'px';
    const t=dropOf(e.clientX,e.clientY);if(t!==lastOver){document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));if(t)t.classList.add('over');lastOver=t}
  });
  document.addEventListener('touchmove',e=>{if(window._dragging)e.preventDefault()},{passive:false});
  const finish=e=>{
    if(!dg){return}
    if(!dg.active){clearTimeout(timer);dg=null;return}
    const t=dropOf(e.clientX,e.clientY),kind=dg.kind,id=dg.id;
    cleanup();swJust=true;setTimeout(()=>{swJust=false},120);
    if(!t)return;const date=t.getAttribute('data-drop');
    if(date.startsWith('ptype:')){convertTo(kind,id,date.slice(6));return}
    if(kind==='o')return;
    if(kind==='e'){if(!date){toast('Un événement a besoin d’une date');return}
      const ev=S.events.find(x=>x.id===id);if(!ev||ev.date===date)return;hist.push(JSON.stringify(S));if(hist.length>20)hist.shift();redo=[];ev.date=date;}
    else{const n=S.notes.find(x=>x.id===id);if(!n||(n.due||'')===date)return;hist.push(JSON.stringify(S));if(hist.length>20)hist.shift();redo=[];n.due=date;if(date)n.inbox=false}
    persist();render();if(sheet)renderSheet();toast(date?'Déplacé : '+frDate(fromYmd(date)):'Déplacé : sans date');
  };
  document.addEventListener('pointerup',finish);
  document.addEventListener('pointercancel',e=>{if(dg&&dg.active)finish(e);else{clearTimeout(timer);dg=null}});
})();
function closeSw(){if(swOpen){swOpen.classList.remove('open');const i=swOpen.lastElementChild;if(i)i.style.transform='';swOpen=null}}
(function(){
  let st=null;
  document.addEventListener('pointerdown',e=>{const row=e.target.closest('.swipe');if(swOpen&&swOpen!==row&&!e.target.closest('.swdel'))closeSw();if(!row||e.target.closest('.swdel')){st=null;return}st={row,x:e.clientX,y:e.clientY,drag:false,base:row.classList.contains('open')?-92:0,v:0}});
  document.addEventListener('pointermove',e=>{if(window._dragging){st=null;return}if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(!st.drag){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.5){st.drag=true;st.row.classList.add('moving')}else if(Math.abs(dy)>10){st=null;return}}
    if(st&&st.drag){st.v=Math.max(-92,Math.min(0,st.base+dx));st.row.lastElementChild.style.transform='translateX('+st.v+'px)'}});
  const end=()=>{if(!st)return;if(st.drag){const o=st.v<-46;st.row.classList.remove('moving');st.row.classList.toggle('open',o);st.row.lastElementChild.style.transform=o?'translateX(-92px)':'';swOpen=o?st.row:null;swJust=true;setTimeout(()=>{swJust=false},60)}st=null};
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
  document.addEventListener('click',e=>{if(swJust){e.stopPropagation();e.preventDefault();return}if(swOpen&&!e.target.closest('.swdel')){const r=e.target.closest('.swipe'),was=swOpen;closeSw();if(r===was){e.stopPropagation();e.preventDefault()}}},true);
})();
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');
  if(!t)return;
  const a=t.dataset.act;
  if(a==='scrim'){if(ev.target===t)closeSheet();return}
  const f=ACT[a];if(!f)return;
  const before=MUT.has(a)?JSON.stringify(S):null;
  f(t.dataset.v,t.dataset.id,t,ev);
  if(before!==null&&JSON.stringify(S)!==before){hist.push(before);if(hist.length>20)hist.shift();redo=[];render()}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!sheet){genRecurring();render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&sheet)closeSheet()});
document.addEventListener('keydown',ev=>{const t=ev.target;if(t&&t.id==='idn'&&ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();if(t.value.trim()){hist.push(JSON.stringify(S));if(hist.length>20)hist.shift();redo=[]}ACT.addIdea()}});
function keepFocus(id,val,setter){const t=$('#'+id);const pos=t.selectionStart;setter(val);render();const i=$('#'+id);i.focus();try{i.setSelectionRange(pos,pos)}catch(e){}}
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.classList&&t.classList.contains('bin')){let d=t.value.replace(/\D/g,'').slice(0,8);t.value=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d}
  if(t.id==='q')keepFocus('q',t.value,v=>qToday=v);
  else if(t.id==='qt')keepFocus('qt',t.value,v=>qTodo=v);
  else if(t.id==='qr')keepFocus('qr',t.value,v=>qRes=v);
  else if(t.id==='idt'){S.ideas=t.value;persist()}
  else if(t.id==='who')keepFocus('who',t.value,v=>window._who=v);
  else if(t.id==='gq'){sheet.q=t.value;$('#gres').innerHTML=resHTML(t.value.trim())}
  else if(t.id==='cn'){S.className=t.value;persist()}
  else if(t.dataset&&t.dataset.sname){const s=subj(t.dataset.sname);if(s){s.name=t.value;persist()}}
});
document.addEventListener('change',ev=>{
  const b=ev.target;if(b&&b.id==='pb'){const p=pupil(b.dataset.pid);if(p){const v=b.value.trim()?parseBirth(b.value):'';if(v===null){toast('Date non reconnue, écris par exemple 09/10/2015');return}hist.push(JSON.stringify(S));redo=[];p.birth=v;persist();renderSheet();render()}}
});
document.addEventListener('change',async ev=>{
  if(ev.target.id==='ph'&&ev.target.files[0]){
    readNote();
    try{sheet.d.photo=await resizeImage(ev.target.files[0]);renderSheet()}catch(e){toast('Photo illisible')}
  }
  if(ev.target.dataset&&ev.target.dataset.cust){const s=subj(ev.target.dataset.cust);if(s){hist.push(JSON.stringify(S));redo=[];s.color=ev.target.value;openColor='';persist();render()}}
  if(ev.target.id==='nd'){readNote();renderSheet()}
  if(ev.target.id==='imp'&&ev.target.files[0]){
    try{const d=JSON.parse(await ev.target.files[0].text());if(!d||!Array.isArray(d.notes))throw 0;
      if(confirm('Remplacer les données de cet appareil par cette copie ?')){hist.push(JSON.stringify(S));redo=[];S=d;ensure();applyTheme();persist();sheet=null;view='today';render();toast('Copie restaurée')}}
    catch(e){toast('Fichier non reconnu')}
    ev.target.value='';
  }
});

ensure();applyTheme();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();render()})}catch(e){}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
